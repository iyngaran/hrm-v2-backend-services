syntax = "proto3";

// Common Types Package
// Import this file when you need common types and timestamp functionality
package common;

// Re-export commonly used Google types
import "google/protobuf/timestamp.proto";

// Common timestamp mixin - can be embedded in other messages
message TimestampFields {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  google.protobuf.Timestamp deleted_at = 3;
}

// Common pagination
message PaginationRequest {
  int32 page = 1;
  int32 limit = 2;
}

message PaginationResponse {
  int32 page = 1;
  int32 limit = 2;
  int32 total_count = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

// Common response status
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_SUCCESS = 1;
  STATUS_ERROR = 2;
  STATUS_NOT_FOUND = 3;
  STATUS_VALIDATION_ERROR = 4;
}

// Common error
message Error {
  string code = 1;
  string message = 2;
  string field = 3;
}


enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_EMPLOYEE = 1;
  RESOURCE_TYPE_LEAVE = 2;
  RESOURCE_TYPE_ATTENDANCE = 3;
  RESOURCE_TYPE_PAYROLL = 4;
  RESOURCE_TYPE_PERFORMANCE = 5;
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_CREATE = 1;
  ACTION_TYPE_READ = 2;
  ACTION_TYPE_UPDATE = 3;
  ACTION_TYPE_DELETE = 4;
  ACTION_TYPE_APPROVE = 5;
}

enum PermissionScope {
  PERMISSION_SCOPE_UNSPECIFIED = 0;
  PERMISSION_SCOPE_SELF = 1;
  PERMISSION_SCOPE_TEAM = 2;
  PERMISSION_SCOPE_DEPARTMENT = 3;
  PERMISSION_SCOPE_BRANCH = 4;
  PERMISSION_SCOPE_ORGANIZATION = 5;
}
