syntax = "proto3";

package user.v1;
import "user-service/users/types.proto";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
  rpc FindAllUsers(FindAllUsersRequest) returns (FindAllUsersResponse) {}
  rpc FindOneUser(FindOneUserRequest) returns (FindOneUserResponse) {}
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {}
  rpc RemoveUser(RemoveUserRequest) returns (RemoveUserResponse) {}
  rpc QueryUsers(stream QueryUsersRequest) returns (stream QueryUsersResponse) {}
}


message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string primary_phone_number = 4;
  string password = 5;
}

message CreateUserResponse {
  string status = 1;
  string message = 2;
  User data = 3;
  repeated string errors = 4;
}

message FindAllUsersRequest {
  string page = 1;
  string limit = 2;
}

message FindAllUsersResponse {
  repeated User users = 1;
}

message FindOneUserRequest {
  string id = 1;
}

message FindOneUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string primary_phone_number = 5;
}

message UpdateUserResponse {
  User user = 1;
}

message RemoveUserRequest {
  string id = 1;
}

message RemoveUserResponse {
  string message = 1;
}

message QueryUsersRequest {
  int32 page = 1;
  int32 limit = 2;
}

message QueryUsersResponse {
  repeated User users = 1;
}
